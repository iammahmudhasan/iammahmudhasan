<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B111E" />
      <stop offset="100%" stop-color="#05080F" />
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0.95" />
    </linearGradient>

    <!-- Clean Line Gradients -->
    <linearGradient id="flow-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <linearGradient id="flow-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="flow-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <linearGradient id="flow-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0EA5E9" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="sync-left" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 7 1.5 L 1 5 L 7 8.5 z" fill="#0EA5E9" />
    </marker>
    <marker id="sync-right" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 7 5 L 1 8.5 z" fill="#06B6D4" />
    </marker>

    <!-- Subtle Emerald Glow for Final Card -->
    <filter id="subtle-glow-emerald" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#10B981" flood-opacity="0.25" />
    </filter>

    <!-- Refined Minimal Dot Grid -->
    <pattern id="clean-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.4" />
    </pattern>

    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #94A3B8; }
      .badge-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.5px; }
      .container-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 10.5px; font-weight: 800; fill: #38BDF8; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Frame -->
  <rect width="838" height="598" x="1" y="1" rx="16" fill="url(#canvas-bg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Background Grid -->
  <rect width="836" height="596" x="2" y="2" rx="15" fill="url(#clean-grid)" />

  <!-- Ambient Clean Light -->
  <circle cx="420" cy="50" r="140" fill="#3B82F6" opacity="0.08" filter="blur(50px)" />
  <circle cx="420" cy="530" r="140" fill="#10B981" opacity="0.09" filter="blur(50px)" />

  <!-- Connecting Conduits -->
  <line x1="420" y1="88" x2="420" y2="126" stroke="url(#flow-1)" stroke-width="2" marker-end="url(#arrow-sky)" />
  <line x1="420" y1="188" x2="420" y2="226" stroke="url(#flow-2)" stroke-width="2" marker-end="url(#arrow-cyan)" />
  <line x1="420" y1="288" x2="420" y2="326" stroke="url(#flow-3)" stroke-width="2" marker-end="url(#arrow-sky)" />
  <line x1="420" y1="468" x2="420" y2="506" stroke="url(#flow-4)" stroke-width="2" marker-end="url(#arrow-emerald)" />

  <!-- NODE 1: AI Gateway -->
  <g transform="translate(195, 26)">
    <rect width="450" height="62" rx="12" fill="url(#card-glass)" stroke="#3B82F6" stroke-width="1.4" />
    <line x1="12" y1="1" x2="438" y2="1" stroke="#FFFFFF" stroke-opacity="0.15" stroke-linecap="round" />
    <!-- Icon Badge -->
    <rect x="16" y="13" width="36" height="36" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
    <circle cx="34" cy="31" r="9" stroke="#60A5FA" stroke-width="1.3" fill="none" />
    <ellipse cx="34" cy="31" rx="3.5" ry="9" stroke="#60A5FA" stroke-width="1.1" fill="none" />
    <line x1="25" y1="31" x2="43" y2="31" stroke="#60A5FA" stroke-width="1.1" />
    <!-- Content -->
    <text x="64" y="31" class="card-title">AI Gateway</text>
    <text x="64" y="48" class="card-desc">Ingress Routing • Rate Limiting • Load Balancing</text>
  </g>

  <!-- NODE 2: Identity, Security & Guardrails -->
  <g transform="translate(195, 126)">
    <rect width="450" height="62" rx="12" fill="url(#card-glass)" stroke="#0EA5E9" stroke-width="1.4" />
    <line x1="12" y1="1" x2="438" y2="1" stroke="#FFFFFF" stroke-opacity="0.15" stroke-linecap="round" />
    <!-- Icon Badge -->
    <rect x="16" y="13" width="36" height="36" rx="8" fill="#0C2D48" stroke="#0EA5E9" stroke-width="1" />
    <path d="M 34 20 L 25 24 L 25 31 C 25 36 29 40 34 41 C 39 40 43 36 43 31 L 43 24 Z" stroke="#38BDF8" stroke-width="1.4" fill="none" />
    <circle cx="34" cy="30" r="2.5" fill="#38BDF8" />
    <!-- Content -->
    <text x="64" y="31" class="card-title">Identity, Security &amp; Guardrails</text>
    <text x="64" y="48" class="card-desc">Auth Verification • Policy Enforcement • Prompt Armor</text>
  </g>

  <!-- NODE 3: Model Serving & Routing -->
  <g transform="translate(195, 226)">
    <rect width="450" height="62" rx="12" fill="url(#card-glass)" stroke="#06B6D4" stroke-width="1.4" />
    <line x1="12" y1="1" x2="438" y2="1" stroke="#FFFFFF" stroke-opacity="0.15" stroke-linecap="round" />
    <!-- Icon Badge -->
    <rect x="16" y="13" width="36" height="36" rx="8" fill="#083344" stroke="#06B6D4" stroke-width="1" />
    <path d="M 35 20 L 28 30 L 33 30 L 32 40 L 40 29 L 35 29 Z" fill="#22D3EE" />
    <!-- Content -->
    <text x="64" y="31" class="card-title">Model Serving &amp; Routing</text>
    <text x="64" y="48" class="card-desc">vLLM / TensorRT-LLM • Dynamic MoE • Speculative Exec</text>
  </g>

  <!-- NODE 4: AGENT RUNTIME CORE CONTAINER -->
  <g transform="translate(45, 326)">
    <!-- Container Outline -->
    <rect width="750" height="142" rx="14" fill="#060A12" fill-opacity="0.85" stroke="#0EA5E9" stroke-width="1.3" stroke-dasharray="6 4" />

    <!-- Top Centered Header Badge -->
    <rect x="275" y="-13" width="200" height="26" rx="13" fill="#0B1322" stroke="#0EA5E9" stroke-width="1.2" />
    <circle cx="295" cy="0" r="3.5" fill="#38BDF8" />
    <text x="382" y="4" text-anchor="middle" class="container-title">AGENT RUNTIME CORE</text>

    <!-- Sub-Node A: Tool & Action Execution -->
    <g transform="translate(25, 25)">
      <rect width="325" height="92" rx="10" fill="url(#card-glass)" stroke="#0EA5E9" stroke-width="1.2" />
      <line x1="8" y1="1" x2="317" y2="1" stroke="#FFFFFF" stroke-opacity="0.12" stroke-linecap="round" />
      <rect x="14" y="15" width="36" height="36" rx="8" fill="#0C2D48" stroke="#0EA5E9" stroke-width="1" />
      <path d="M 23 27 L 28 33 L 23 39" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <line x1="30" y1="39" x2="39" y2="39" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
      <text x="60" y="32" class="card-title" font-size="14">Tool &amp; Action Execution</text>
      <text x="60" y="50" class="card-desc" font-size="11">Sandboxed Code Execution</text>
      <text x="60" y="67" class="card-desc" font-size="11">API Connectors • File I/O Workflows</text>
    </g>

    <!-- Connecting Arrow Between Core Nodes -->
    <g transform="translate(350, 71)">
      <line x1="5" y1="0" x2="45" y2="0" stroke="#0EA5E9" stroke-width="2" marker-start="url(#sync-left)" marker-end="url(#sync-right)" />
      <circle cx="25" cy="0" r="3" fill="#38BDF8" />
    </g>

    <!-- Sub-Node B: Dynamic Memory Engine -->
    <g transform="translate(400, 25)">
      <rect width="325" height="92" rx="10" fill="url(#card-glass)" stroke="#06B6D4" stroke-width="1.2" />
      <line x1="8" y1="1" x2="317" y2="1" stroke="#FFFFFF" stroke-opacity="0.12" stroke-linecap="round" />
      <rect x="14" y="15" width="36" height="36" rx="8" fill="#083344" stroke="#06B6D4" stroke-width="1" />
      <circle cx="32" cy="33" r="8" stroke="#22D3EE" stroke-width="1.4" fill="none" />
      <circle cx="32" cy="33" r="3.5" fill="#22D3EE" />
      <text x="60" y="32" class="card-title" font-size="14">Dynamic Memory Engine</text>
      <text x="60" y="50" class="card-desc" font-size="11">Vector Embeddings &amp; RAG</text>
      <text x="60" y="67" class="card-desc" font-size="11">Short/Long-Term Episodic Memory</text>
    </g>
  </g>

  <!-- NODE 5: Verification, Guardrails & Evaluation -->
  <g transform="translate(170, 506)">
    <rect width="500" height="64" rx="12" fill="url(#card-glass)" stroke="#10B981" stroke-width="1.6" filter="url(#subtle-glow-emerald)" />
    <line x1="12" y1="1" x2="488" y2="1" stroke="#FFFFFF" stroke-opacity="0.18" stroke-linecap="round" />
    <!-- Icon Badge -->
    <rect x="16" y="14" width="36" height="36" rx="8" fill="#022C22" stroke="#10B981" stroke-width="1.2" />
    <path d="M 26 32 L 31 37 L 41 26" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Content -->
    <text x="64" y="31" class="card-title" fill="#34D399">Verification, Guardrails &amp; Evaluation</text>
    <text x="64" y="48" class="card-desc">Output Integrity • Autonomous Self-Correction • Regression Evals</text>
  </g>

</svg>
