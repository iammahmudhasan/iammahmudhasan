<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Line Gradients -->
    <linearGradient id="line-indigo-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="line-cyan-violet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="line-violet-indigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="line-indigo-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366F1" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-sync-left" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 8 1 L 0 5 L 8 9 z" fill="#A855F7" />
    </marker>
    <marker id="arrow-sync-right" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06B6D4" />
    </marker>

    <!-- Glow Filters -->
    <filter id="glow-indigo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.35" />
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.35" />
    </filter>

    <style>
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14.5px; fill: #F8FAFC; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #94A3B8; }
      .container-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; font-weight: 700; fill: #A5B4FC; letter-spacing: 1.8px; text-transform: uppercase; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 9.5px; font-weight: 600; fill: #38BDF8; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="798" height="578" x="1" y="1" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="400" cy="40" r="160" fill="#6366F1" opacity="0.12" filter="blur(50px)" />
  <circle cx="200" cy="380" r="120" fill="#06B6D4" opacity="0.08" filter="blur(45px)" />
  <circle cx="600" cy="380" r="120" fill="#A855F7" opacity="0.08" filter="blur(45px)" />
  <circle cx="400" cy="530" r="130" fill="#10B981" opacity="0.1" filter="blur(45px)" />

  <!-- Connector 1: Gateway to Security -->
  <line x1="400" y1="82" x2="400" y2="120" stroke="url(#line-indigo-cyan)" stroke-width="2" marker-end="url(#arrow-indigo)" />

  <!-- Connector 2: Security to Serving -->
  <line x1="400" y1="174" x2="400" y2="212" stroke="url(#line-cyan-violet)" stroke-width="2" marker-end="url(#arrow-cyan)" />

  <!-- Connector 3: Serving to Runtime -->
  <line x1="400" y1="266" x2="400" y2="304" stroke="url(#line-violet-indigo)" stroke-width="2" marker-end="url(#arrow-violet)" />

  <!-- Connector 4: Runtime to Verification -->
  <line x1="400" y1="442" x2="400" y2="480" stroke="url(#line-indigo-emerald)" stroke-width="2" marker-end="url(#arrow-emerald)" />

  <!-- NODE 1: AI Gateway -->
  <g transform="translate(230, 24)">
    <rect width="340" height="58" rx="10" fill="url(#card-grad)" stroke="#6366F1" stroke-width="1.5" filter="url(#glow-indigo)" />
    <circle cx="28" cy="29" r="14" fill="#1E1B4B" stroke="#818CF8" stroke-width="1" />
    <text x="28" y="34" text-anchor="middle" font-size="14">🌐</text>
    <text x="54" y="27" class="node-title">AI Gateway</text>
    <text x="54" y="44" class="node-desc">Ingress Routing • Rate Limiting • Load Balancing</text>
  </g>

  <!-- NODE 2: Identity & Security -->
  <g transform="translate(230, 116)">
    <rect width="340" height="58" rx="10" fill="url(#card-grad)" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="28" cy="29" r="14" fill="#082F49" stroke="#38BDF8" stroke-width="1" />
    <text x="28" y="34" text-anchor="middle" font-size="14">🛡️</text>
    <text x="54" y="27" class="node-title">Identity, Security &amp; Guardrails</text>
    <text x="54" y="44" class="node-desc">Auth Verification • Policy Enforcement • Prompt Armor</text>
  </g>

  <!-- NODE 3: Model Serving & Routing -->
  <g transform="translate(230, 208)">
    <rect width="340" height="58" rx="10" fill="url(#card-grad)" stroke="#8B5CF6" stroke-width="1.5" />
    <circle cx="28" cy="29" r="14" fill="#2E1065" stroke="#A855F7" stroke-width="1" />
    <text x="28" y="34" text-anchor="middle" font-size="14">⚡</text>
    <text x="54" y="27" class="node-title">Model Serving &amp; Routing</text>
    <text x="54" y="44" class="node-desc">vLLM / TensorRT-LLM • Dynamic MoE • Speculative Exec</text>
  </g>

  <!-- NODE 4: Autonomous Agent Runtime (Outer Container) -->
  <g transform="translate(70, 304)">
    <!-- Container Outline -->
    <rect width="660" height="138" rx="14" fill="#020617" fill-opacity="0.75" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="6 6" />
    
    <!-- Header Tag -->
    <rect x="235" y="-12" width="190" height="24" rx="12" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" />
    <text x="330" y="4" text-anchor="middle" class="container-title">⚡ AGENT RUNTIME CORE</text>

    <!-- Left Child: Tools -->
    <g transform="translate(30, 32)">
      <rect width="270" height="78" rx="10" fill="url(#card-grad)" stroke="#06B6D4" stroke-width="1.2" />
      <circle cx="28" cy="39" r="14" fill="#083344" stroke="#06B6D4" stroke-width="1" />
      <text x="28" y="44" text-anchor="middle" font-size="14">🛠️</text>
      <text x="52" y="34" class="node-title">Tool &amp; Action Execution</text>
      <text x="52" y="52" class="node-desc">Sandboxed Code Execution</text>
      <text x="52" y="67" class="node-desc">API Connectors • File I/O Workflows</text>
    </g>

    <!-- Bidirectional Connection Between Tools & Memory -->
    <line x1="305" y1="71" x2="355" y2="71" stroke="#818CF8" stroke-width="1.8" stroke-dasharray="3 3" />
    <line x1="312" y1="71" x2="348" y2="71" stroke="#818CF8" stroke-width="1.8" marker-start="url(#arrow-sync-left)" marker-end="url(#arrow-sync-right)" />

    <!-- Right Child: Memory -->
    <g transform="translate(360, 32)">
      <rect width="270" height="78" rx="10" fill="url(#card-grad)" stroke="#EC4899" stroke-width="1.2" />
      <circle cx="28" cy="39" r="14" fill="#500724" stroke="#EC4899" stroke-width="1" />
      <text x="28" y="44" text-anchor="middle" font-size="14">🧠</text>
      <text x="52" y="34" class="node-title">Dynamic Memory Engine</text>
      <text x="52" y="52" class="node-desc">Vector Embeddings &amp; RAG</text>
      <text x="52" y="67" class="node-desc">Short/Long-Term Episodic Memory</text>
    </g>
  </g>

  <!-- NODE 5: Verification & Evaluation -->
  <g transform="translate(200, 480)">
    <rect width="400" height="64" rx="10" fill="url(#card-grad)" stroke="#10B981" stroke-width="1.5" filter="url(#glow-emerald)" />
    <circle cx="32" cy="32" r="15" fill="#022C22" stroke="#10B981" stroke-width="1" />
    <text x="32" y="38" text-anchor="middle" font-size="15">✅</text>
    <text x="58" y="29" class="node-title">Verification, Guardrails &amp; Evaluation</text>
    <text x="58" y="48" class="node-desc">Output Integrity • Autonomous Self-Correction • Regression Evals</text>
  </g>

</svg>
