<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 514" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B111E" />
      <stop offset="100%" stop-color="#05080F" />
    </linearGradient>

    <!-- Continuous Stepper Rail Gradient -->
    <linearGradient id="stepper-rail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="18%" stop-color="#0EA5E9" />
      <stop offset="36%" stop-color="#06B6D4" />
      <stop offset="54%" stop-color="#14B8A6" />
      <stop offset="72%" stop-color="#0D9488" />
      <stop offset="90%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Glass Card Surface -->
    <linearGradient id="glass-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0.95" />
    </linearGradient>

    <!-- Subtle Emerald Glow for Final Card -->
    <filter id="stack-glow-emerald" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#10B981" flood-opacity="0.25" />
    </filter>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="stack-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.4" />
    </pattern>

    <style>
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11.5px; font-weight: 800; fill: #FFFFFF; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .step-sep { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Frame -->
  <rect width="838" height="512" x="1" y="1" rx="16" fill="url(#stack-bg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Background Grid -->
  <rect width="836" height="510" x="2" y="2" rx="15" fill="url(#stack-grid)" />

  <!-- Continuous Stepper Rail -->
  <line x1="54" y1="44" x2="54" y2="470" stroke="url(#stepper-rail)" stroke-width="2.5" stroke-linecap="round" />

  <!-- ==================== STEP 01 ==================== -->
  <g transform="translate(0, 22)">
    <circle cx="54" cy="24" r="15" fill="#0F172A" stroke="#3B82F6" stroke-width="1.8" />
    <text x="54" y="28" text-anchor="middle" class="step-num">01</text>
    
    <rect x="86" y="0" width="728" height="48" rx="9" fill="url(#glass-surface)" stroke="#1E293B" stroke-width="1" />
    <line x1="94" y1="1" x2="806" y2="1" stroke="#FFFFFF" stroke-opacity="0.12" stroke-linecap="round" />
    <rect x="86" y="0" width="3.5" height="48" rx="1.5" fill="#3B82F6" />
    
    <text x="106" y="29" class="step-title">Data Curation &amp; Quality Filtering</text>
    <text x="350" y="29" class="step-sep">—</text>
    <text x="370" y="29" class="step-desc">Synthetic Data Gen • Deduplication • Toxicity &amp; Quality Scoring</text>
  </g>

  <!-- ==================== STEP 02 ==================== -->
  <g transform="translate(0, 90)">
    <circle cx="54" cy="24" r="15" fill="#0C2D48" stroke="#0EA5E9" stroke-width="1.8" />
    <text x="54" y="28" text-anchor="middle" class="step-num">02</text>
    
    <rect x="86" y="0" width="728" height="48" rx="9" fill="url(#glass-surface)" stroke="#1E293B" stroke-width="1" />
    <line x1="94" y1="1" x2="806" y2="1" stroke="#FFFFFF" stroke-opacity="0.12" stroke-linecap="round" />
    <rect x="86" y="0" width="3.5" height="48" rx="1.5" fill="#0EA5E9" />
    
    <text x="106" y="29" class="step-title">Tokenization &amp; Architecture</text>
    <text x="350" y="29" class="step-sep">—</text>
    <text x="370" y="29" class="step-desc">Custom Byte-Pair Encoding • Rotary Embeddings (RoPE) • FlashAttention</text>
  </g>

  <!-- ==================== STEP 03 ==================== -->
  <g transform="translate(0, 158)">
    <circle cx="54" cy="24" r="15" fill="#083344" stroke="#06B6D4" stroke-width="1.8" />
    <text x="54" y="28" text-anchor="middle" class="step-num">03</text>
    
    <rect x="86" y="0" width="728" height="48" rx="9" fill="url(#glass-surface)" stroke="#1E293B" stroke-width="1" />
    <line x1="94" y1="1" x2="806" y2="1" stroke="#FFFFFF" stroke-opacity="0.12" stroke-linecap="round" />
    <rect x="86" y="0" width="3.5" height="48" rx="1.5" fill="#06B6D4" />
    
    <text x="106" y="29" class="step-title">Pre-Training &amp; Distributed Compute</text>
    <text x="350" y="29" class="step-sep">—</text>
    <text x="370" y="29" class="step-desc">DeepSpeed ZeRO • PyTorch FSDP • Multi-GPU Cluster Orchestration</text>
  </g>

  <!-- ==================== STEP 04 ==================== -->
  <g transform="translate(0, 226)">
    <circle cx="54" cy="24" r="15" fill="#042F2E" stroke="#14B8A6" stroke-width="1.8" />
    <text x="54" y="28" text-anchor="middle" class="step-num">04</text>
    
    <rect x="86" y="0" width="728" height="48" rx="9" fill="url(#glass-surface)" stroke="#1E293B" stroke-width="1" />
    <line x1="94" y1="1" x2="806" y2="1" stroke="#FFFFFF" stroke-opacity="0.12" stroke-linecap="round" />
    <rect x="86" y="0" width="3.5" height="48" rx="1.5" fill="#14B8A6" />
    
    <text x="106" y="29" class="step-title">Post-Training &amp; Alignment</text>
    <text x="350" y="29" class="step-sep">—</text>
    <text x="370" y="29" class="step-desc">Supervised Fine-Tuning (SFT) • RLHF / Direct Preference Optimization (DPO)</text>
  </g>

  <!-- ==================== STEP 05 ==================== -->
  <g transform="translate(0, 294)">
    <circle cx="54" cy="24" r="15" fill="#042F2E" stroke="#0D9488" stroke-width="1.8" />
    <text x="54" y="28" text-anchor="middle" class="step-num">05</text>
    
    <rect x="86" y="0" width="728" height="48" rx="9" fill="url(#glass-surface)" stroke="#1E293B" stroke-width="1" />
    <line x1="94" y1="1" x2="806" y2="1" stroke="#FFFFFF" stroke-opacity="0.12" stroke-linecap="round" />
    <rect x="86" y="0" width="3.5" height="48" rx="1.5" fill="#0D9488" />
    
    <text x="106" y="29" class="step-title">Inference Serving &amp; MoE</text>
    <text x="350" y="29" class="step-sep">—</text>
    <text x="370" y="29" class="step-desc">vLLM Serving • Speculative Decoding • Mixture-of-Experts Dynamic Routing</text>
  </g>

  <!-- ==================== STEP 06 ==================== -->
  <g transform="translate(0, 362)">
    <circle cx="54" cy="24" r="15" fill="#022C22" stroke="#10B981" stroke-width="1.8" />
    <text x="54" y="28" text-anchor="middle" class="step-num">06</text>
    
    <rect x="86" y="0" width="728" height="48" rx="9" fill="url(#glass-surface)" stroke="#1E293B" stroke-width="1" />
    <line x1="94" y1="1" x2="806" y2="1" stroke="#FFFFFF" stroke-opacity="0.12" stroke-linecap="round" />
    <rect x="86" y="0" width="3.5" height="48" rx="1.5" fill="#10B981" />
    
    <text x="106" y="29" class="step-title">Autonomous Agent Runtime</text>
    <text x="350" y="29" class="step-sep">—</text>
    <text x="370" y="29" class="step-desc">Task Graphs • Sandboxed Tool Execution • Self-Verification Loops</text>
  </g>

  <!-- ==================== STEP 07 ==================== -->
  <g transform="translate(0, 430)">
    <circle cx="54" cy="24" r="15" fill="#022C22" stroke="#34D399" stroke-width="2" />
    <text x="54" y="28" text-anchor="middle" class="step-num" fill="#34D399">07</text>
    
    <!-- Step 07 Production Highlight Card -->
    <rect x="86" y="0" width="728" height="48" rx="9" fill="url(#glass-surface)" stroke="#10B981" stroke-width="1.3" filter="url(#stack-glow-emerald)" />
    <line x1="94" y1="1" x2="806" y2="1" stroke="#FFFFFF" stroke-opacity="0.18" stroke-linecap="round" />
    <rect x="86" y="0" width="3.5" height="48" rx="1.5" fill="#10B981" />
    
    <text x="106" y="29" class="step-title" fill="#34D399">Production AI System at Scale</text>
    <text x="350" y="29" class="step-sep">—</text>
    <text x="370" y="29" class="step-desc" fill="#A7F3D0">High-Availability Deployment • Security Guardrails • Autonomous Telemetry</text>
  </g>

</svg>
